[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "facebook-last-post"
version = "0.1.0"
description = "Resumable public Facebook page last-post enrichment for PostgreSQL lead warehouses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.55,<2",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]

[project.scripts]
facebook-last-post = "facebook_last_post.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
facebook_last_post = ["migrations/*.sql"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
